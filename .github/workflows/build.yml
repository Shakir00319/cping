name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MikroPing-Android-Project.zip -d MikroPing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: cd MikroPing && gradle assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning
      - uses: actions/upload-artifact@v4
        with:
          name: MikroPing-apk
          path: MikroPing/app/build/outputs/apk/debug/app-debug.apk
