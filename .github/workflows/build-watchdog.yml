name: Build Watchdog APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: cd MikroTikWatchdog && gradle assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning

      - uses: actions/upload-artifact@v4
        with:
          name: MikroTikWatchdog-apk
          path: MikroTikWatchdog/app/build/outputs/apk/debug/app-debug.apk
